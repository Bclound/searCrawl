services:
  searxng:
    image: searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    entrypoint: ["/bin/sh", "/opt/searcrawl-entrypoint.sh"]
    volumes:
      - ./deploy/searxng.yml:/opt/searcrawl-settings.yml:ro
      - ./deploy/searxng-entrypoint.sh:/opt/searcrawl-entrypoint.sh:ro
      - searxng-config:/etc/searxng
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
  searcrawl:
    build: .
    init: true
    shm_size: 1gb
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      SEARXNG_HOST: searxng
      SEARXNG_PORT: 8080
      SEARXNG_BASE_PATH: /search
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-15}
      CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-90}
    ports:
      - "127.0.0.1:${SEARCRAWL_PORT:-3000}:3000"
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  searxng-config:
